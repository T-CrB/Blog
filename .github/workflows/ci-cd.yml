name: CI / CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test deployment scripts
        run: python3 -B -m unittest discover -s tests -p 'test_github_deploy.py'

      - name: Build site
        run: npm run build

      - name: Package static site and ECS setup
        run: |
          python3 -B deploy/github/site_release.py dist "$RUNNER_TEMP/site-release" "$GITHUB_SHA" "$GITHUB_RUN_NUMBER"
          tar -C deploy/github -czf "$RUNNER_TEMP/site-release/tcrb-blog-ecs-setup.tar.gz" \
            install-ecs.sh pull.py site_release.py tcrb-web-deploy.service tcrb-web-deploy.timer

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: site-release
          path: ${{ runner.temp }}/site-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  deploy:
    name: Publish production build to GitHub Releases
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    concurrency:
      group: production-deploy
      queue: max

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: site-release
          path: ${{ runner.temp }}/site-release/

      - name: Publish build for ECS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: python3 -B deploy/github/publish.py "$RUNNER_TEMP/site-release"
